<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>冒險遊戲 — 小簡的注音大冒險</title>
<link rel="stylesheet" href="css/site.css">
<style>
  html, body { margin: 0; height: 100%; background: #6cc6f5; overflow: hidden; }
  body { background-image: none; font-family: var(--font); user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas#game { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }

  .hud { position: fixed; top: 14px; left: 16px; display: flex; flex-wrap: wrap; gap: 10px; pointer-events: none; max-width: calc(100vw - 190px); }
  .pill { background: rgba(255,250,235,.92); border: 3px solid #3b2414; border-radius: 999px; padding: 6px 16px;
          font-size: 20px; font-weight: 800; color: #3b2414; box-shadow: 0 3px 0 #3b2414; display: flex; align-items: center; gap: 6px; }
  .pill b { color: #d0552b; }
  .pill.hidden { display: none; }
  .hearts { gap: 2px; padding: 4px 10px; }
  .heart { width: 27px; height: 27px; background: url(assets/kenney/tiles.png) -108px -54px / 540px 243px; image-rendering: pixelated; }
  .heart.empty { background-position: -162px -54px; }
  .heart.lose { animation: lose .5s steps(4); }
  @keyframes lose { 50% { transform: scale(1.5); } }
  .magic-pill b { color: #7b3fbf; }
  .bestiary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; text-align: center; }
  .bestiary div { background: #fff; padding: 6px 4px; font-size: 13px; line-height: 1.35; box-shadow: 0 -3px 0 #3b2414, 0 3px 0 #3b2414, -3px 0 0 #3b2414, 3px 0 0 #3b2414; margin: 3px; }
  .bestiary canvas { width: 48px; height: 48px; image-rendering: pixelated; display: block; margin: 0 auto 2px; }
  .bestiary b { display: block; font-size: 14px; }
  .bestiary .no { color: #c0392b; } .bestiary .ok { color: #2e9d4a; }
  .card { max-height: 94vh; overflow: auto; }
  .gem-icon { width: 16px; height: 20px; background: #4fc3f7; border: 2.5px solid #3b2414; clip-path: polygon(50% 0, 100% 35%, 50% 100%, 0 35%); }

  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(40,90,130,.35); }
  .overlay.hidden { display: none; }
  .overlay.danger { background: rgba(60,20,30,.45); }
  .card { background: #fffaeb; border: 5px solid #3b2414; border-radius: 28px; padding: 28px 40px; text-align: center;
          box-shadow: 0 8px 0 #3b2414; max-width: min(520px, 86vw); color: #3b2414; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .card h1 { margin: 0 0 8px; font-size: clamp(28px, 6vw, 44px); letter-spacing: 2px; }
  .card h2 { margin: 0 0 8px; font-size: clamp(24px, 5vw, 36px); color: #c0392b; }
  .card p { margin: 6px 0; font-size: 18px; line-height: 1.6; }
  .card kbd { background: #fff; border: 2px solid #3b2414; border-radius: 6px; padding: 0 8px; font-family: inherit; font-weight: 700; }
  .btn { margin-top: 16px; font: inherit; font-size: 22px; font-weight: 800; color: #fff; background: #f08a3c; border: 4px solid #3b2414;
         border-radius: 999px; padding: 10px 36px; box-shadow: 0 5px 0 #3b2414; cursor: pointer; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #3b2414; }

  .home { position: fixed; top: 14px; right: 16px; text-decoration: none; background: rgba(255,250,235,.92); border: 3px solid #3b2414;
          border-radius: 999px; padding: 6px 16px; font-size: 18px; font-weight: 800; color: #3b2414; box-shadow: 0 3px 0 #3b2414; z-index: 5; }
  .toast { position: fixed; top: 76px; left: 50%; transform: translateX(-50%); background: #fffaeb; border: 4px solid #3b2414; border-radius: 18px;
           padding: 8px 22px; font-size: 22px; font-weight: 800; color: #3b2414; box-shadow: 0 4px 0 #3b2414; pointer-events: none;
           opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .toast.show { opacity: 1; }

  /* ───── 注音魔法對決 ───── */
  .duel { background: #fffaeb; border: 5px solid #3b2414; border-radius: 28px; box-shadow: 0 8px 0 #3b2414; color: #3b2414;
          width: min(1000px, 96vw); max-height: 94vh; overflow: auto; padding: 18px 22px; box-sizing: border-box; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  .duel-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
  .duel-head h2 { margin: 0; font-size: clamp(22px, 3.4vw, 32px); flex: 1; }
  .duel-head canvas { width: 70px; height: 80px; }
  .duel-head canvas.hit { animation: hit .5s; }
  @keyframes hit { 0%,100% { transform: none; filter: none; } 20% { transform: translateX(-8px) rotate(-6deg); filter: brightness(2.2); }
                   50% { transform: translateX(8px) rotate(5deg); } 75% { transform: translateX(-4px); } }
  .hp { font-size: 28px; letter-spacing: 2px; }
  .hp .lost { filter: grayscale(1); opacity: .35; }
  .duel-body { display: flex; gap: 18px; flex-wrap: wrap; }
  .pad { position: relative; flex: 1 1 440px; aspect-ratio: 4 / 3; background: #23364a; border: 4px solid #3b2414; border-radius: 18px; overflow: hidden; touch-action: none; }
  .pad video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; transform: scaleX(-1); opacity: .55; }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
  .guide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(26vw, 230px);
           color: rgba(255,255,255,.18); pointer-events: none; opacity: 0; transition: opacity .4s; }
  .guide.show { opacity: 1; }
  .cam-status { position: absolute; left: 10px; bottom: 10px; right: 10px; color: #fff; font-size: 15px; font-weight: 700;
                text-shadow: 0 1px 3px #000; pointer-events: none; }
  .side { flex: 1 1 260px; display: flex; flex-direction: column; gap: 10px; }
  .prompt { background: #fff; border: 3px solid #3b2414; border-radius: 18px; padding: 12px; text-align: center; }
  .prompt .emoji { font-size: 64px; line-height: 1.1; }
  .prompt .word { font-size: 34px; font-weight: 900; letter-spacing: 6px; }
  .prompt p { margin: 4px 0 8px; font-size: 18px; }
  .prompt mark { background: #ffe08a; padding: 0 4px; border-radius: 4px; }
  .gesture { font-size: 15px; line-height: 1.7; background: #eef7ff; border: 2px dashed #6a9cc6; border-radius: 12px; padding: 8px 10px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .sbtn { font: inherit; font-size: 17px; font-weight: 800; color: #3b2414; background: #fff; border: 3px solid #3b2414; border-radius: 999px;
          padding: 6px 16px; box-shadow: 0 3px 0 #3b2414; cursor: pointer; }
  .sbtn:active { transform: translateY(3px); box-shadow: none; }
  .row .btn { margin-top: 0; font-size: 18px; padding: 6px 20px; flex: 1; }
  .feedback { min-height: 32px; font-size: 22px; font-weight: 900; text-align: center; }
  .feedback.ok { color: #2e9d4a; } .feedback.bad { color: #c0392b; }

  .touch { position: fixed; bottom: 18px; display: none; gap: 14px; }
  .touch.left { left: 18px; } .touch.right { right: 18px; }
  .touch button { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #3b2414; background: rgba(255,250,235,.85);
                  font: inherit; font-size: 30px; font-weight: 900; color: #3b2414; box-shadow: 0 4px 0 #3b2414; touch-action: none; }
  .touch button.on { transform: translateY(3px); box-shadow: 0 1px 0 #3b2414; background: #ffe7a8; }
  .touch .jump { width: 92px; height: 92px; background: rgba(240,138,60,.9); color: #fff; font-size: 26px; }
  .touch .magic { width: 76px; height: 76px; background: rgba(199,146,234,.95); color: #fff; font-size: 24px; }
  @media (pointer: coarse) { .touch { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill hearts" id="hearts"></div>
  <div class="pill">距離 <b id="dist">0</b> 公尺</div>
  <div class="pill"><span class="gem-icon"></span>寶石 <b id="gems">0</b></div>
  <div class="pill hidden" id="zhuyinPill">注音 <b id="coins">0</b></div>
  <div class="pill magic-pill hidden" id="magicPill">🪄 魔法 <b id="magicT">0</b> 秒</div>
</div>
<div class="toast" id="toast"></div>
<a class="home" href="index.html">🏠 回首頁</a>

<div class="overlay" id="startScreen">
  <div class="card">
    <h1>小簡的注音大冒險</h1>
    <p>先來小試身手！跳過小怪物、收集寶石，<br>一路往前走找到大怪物吧！</p>
    <p><kbd>←</kbd> <kbd>→</kbd> 移動　<kbd>空白鍵</kbd> / <kbd>↑</kbd> 跳躍　<kbd>X</kbd> 魔法</p>
    <p style="font-size:15px;opacity:.8">❤️ 有 3 顆愛心　❓ 從下面頂問號方塊　🪄 拿到魔杖可以發射魔法　🚩 碰到旗子會存檔　🍄 彈簧蘑菇跳很高</p>
    <div class="bestiary" id="bestiary"></div>
    <button class="btn" id="startBtn">開始冒險</button>
  </div>
</div>

<div class="overlay danger hidden" id="bossScreen">
  <div class="card">
    <h2>大怪物擋住去路了！</h2>
    <p>只有注音魔法才能打敗牠！<br>伸出食指，在空中寫出正確的注音吧！</p>
    <p style="font-size:15px;opacity:.7">需要開啟相機；沒有相機也可以用滑鼠或手指在框裡寫</p>
    <button class="btn" id="challengeBtn">開始注音挑戰</button>
  </div>
</div>

<div class="overlay danger hidden" id="duelScreen">
  <div class="duel">
    <div class="duel-head">
      <canvas id="duelBoss" width="140" height="160"></canvas>
      <h2>注音魔法對決</h2>
      <div class="hp" id="bossHp"></div>
    </div>
    <div class="duel-body">
      <div class="pad" id="pad">
        <video id="cam" playsinline muted></video>
        <div class="guide" id="guide"></div>
        <canvas id="padCanvas"></canvas>
        <div class="cam-status" id="camStatus"></div>
      </div>
      <div class="side">
        <div class="prompt">
          <div class="emoji" id="pEmoji"></div>
          <div class="word" id="pWord"></div>
          <p id="pText"></p>
          <button class="sbtn" id="speakBtn">🔊 聽一聽</button>
        </div>
        <div class="gesture">☝️ 只伸出<b>食指</b>：寫字<br>🖐️ <b>張開手掌</b>停一下：送出魔法<br>✊ <b>握拳</b>停一下：擦掉重寫</div>
        <div class="row">
          <button class="sbtn" id="clearBtn">擦掉</button>
          <button class="sbtn" id="hintBtn">提示</button>
          <button class="btn" id="submitBtn">送出魔法 ⚡</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
  </div>
</div>

<div class="touch left">
  <button data-key="left">◀</button>
  <button data-key="right">▶</button>
</div>
<div class="touch right">
  <button class="magic" data-key="magic" hidden>魔</button>
  <button class="jump" data-key="jump">跳</button>
</div>

<script>
(() => {
  // ───────── 基本設定 ─────────
  const VIEW_H = 540;               // 世界座標的畫面高度（寬度依螢幕比例）
  const FLOOR = 640;                // 地面方塊延伸到的底部（畫面外）
  const BIOME_LEN = 4200;           // 每個場景的長度，草地 / 沙灘交替
  const BOSS_AT = 4600;             // 小試身手區段長度（約 92 公尺）後出現大怪物
  const G = 2100, JUMP_V = 820, MAX_VX = 290, ACCEL = 2400, FRICTION = 2600, AIR_ACCEL = 1700;
  const COYOTE = 0.1, BUFFER = 0.13;
  const ZHUYIN = 'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄧㄨㄩㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦ';
  const GEM_COLORS = [['#ff6b81', '#c2185b'], ['#4fc3f7', '#1976d2'], ['#7ee081', '#2e9d4a'], ['#c792ea', '#7b3fbf'], ['#ffd54f', '#e09a00']];

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let scale = 1, viewW = 960, dpr = 1;

  // 像素風：畫面先用低解析度畫（高 PIXEL_H 點），再由瀏覽器不平滑放大
  const PIXEL_H = 270;
  function resize() {
    dpr = 1;
    canvas.height = PIXEL_H;
    canvas.width = Math.round(PIXEL_H * innerWidth / innerHeight);
    scale = canvas.height / VIEW_H;
    viewW = canvas.width / scale;
  }
  addEventListener('resize', resize);
  resize();

  // ───────── 圖片 ─────────
  const load = src => new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
  const BIOMES = {
    grass: { src: 'assets/grass.png', fillTop: '#4c9a6c', fillBot: '#2e5f45',
             body: '#b97a48', bodyDark: '#94592f', cap: '#86d14e', capDark: '#5fae35', stone: '#d9b08c', line: '#3b2414' },
    beach: { src: 'assets/beach.png', fillTop: '#3cc6d8', fillBot: '#1d8fb0',
             body: '#e2a64c', bodyDark: '#c4842f', cap: '#f8e39a', capDark: '#e9c46a', stone: '#f3cf7d', line: '#4a2c12' },
  };
  const BIOME_ORDER = ['grass', 'beach'];
  const biomeAt = x => BIOME_ORDER[Math.floor(Math.max(0, x) / BIOME_LEN) % BIOME_ORDER.length];

  const IMG = { player: null, boss: null, minion: null, fire: null, tiles: null, chars: null, octo: null, slime: null, ghost: null, ghostShy: null, wand: null };

  // 怪物原圖左邊有火球、左下角有小怪物，先把它們擦掉
  function cleanBoss(img) {
    if (!img) return null;
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    const sx = img.width / 447, sy = img.height / 520;
    g.clearRect(0, 236 * sy, 24 * sx, 108 * sy);
    g.clearRect(0, 436 * sy, 98 * sx, 90 * sy);
    return c;
  }

  // ───────── 像素素材 ─────────
  // Kenney「Pixel Platformer」（CC0）：tiles.png 每格 18px、20 欄；chars.png 每格 24px、9 欄
  const TILE = { heart: 44, gem: 67, spikes: 68, qblock: 10, used: 29, flag: 111, flag2: 112, pole: 131,
                 spring: 108, sign: 85, sprout: 124, grass: 125, tree: 126, cactus: 127, mush: 128, fenceL: 105, fence: 106 };
  const CHAR = { spike: 8, blockCalm: 11, blockMad: 12, bat: [24, 25, 26] };
  function drawSheet(img, cols, cell, i, x, y, w, h, flip = false) {
    if (!img) return;
    ctx.save(); ctx.imageSmoothingEnabled = false;
    ctx.translate(x + (flip ? w : 0), y); if (flip) ctx.scale(-1, 1);
    ctx.drawImage(img, (i % cols) * cell, Math.floor(i / cols) * cell, cell, cell, 0, 0, w, h);
    ctx.restore();
  }
  const drawTile = (i, x, y, size, flip) => drawSheet(IMG.tiles, 20, 18, i, x, y, size, size, flip);
  const drawChar = (i, x, y, size, flip) => drawSheet(IMG.chars, 9, 24, i, x, y, size, size, flip);

  // 自己畫的像素怪物：每個字母代表一種顏色，'.' 是透明
  const PIX = {
    slime: { pal: { k: '#2b1a12', g: '#6fd36b', G: '#3fa34d', h: '#c8f7c0', w: '#ffffff', b: '#1b1b1b', p: '#ff8fa3' }, rows: [
      '......kkkk......', '....kkhhggkk....', '...khhgggggGk...', '..khgggggggggk..', '.khgwbgggggwbgk.', '.kggwbgggggwbgk.',
      'kgggggpgggpggggk', 'kggggggkkgggggGk', 'kgggggggggggggGk', 'kGgggggggggggGGk', '.kGGGGGGGGGGGGk.', '..kkkkkkkkkkkk..'] },
    ghost: { pal: { k: '#3b2a5a', w: '#f4f1ff', b: '#2b1a3a', p: '#ffb3c7', v: '#c9b8ff' }, rows: [
      '....kkkkkk....', '...kwwwwwwk...', '..kwwwwwwwwk..', '.kwwwwwwwwwwk.', '.kwwbbwwbbwwk.', 'kwwwbbwwbbwwwk', 'kwwwwwwwwwwwwk',
      'kwpwwwwwwwwpwk', 'kwwwwwbbwwwwwk', 'kwwwwwwwwwwwwk', 'kwwwwwwwwwwwwk', 'kwwkwwwkwwwkwk', 'kwk.kwk.kwk.kk', '.k...k...k....'] },
    ghostShy: { pal: { k: '#3b2a5a', w: '#f4f1ff', b: '#2b1a3a', p: '#ffb3c7', v: '#c9b8ff' }, rows: [
      '....kkkkkk....', '...kwwwwwwk...', '..kwwwwwwwwk..', '.kwwwwwwwwwwk.', '.kwwvvwwvvwwk.', 'kwwvvvwwvvvwwk', 'kwwwvvwwvvwwwk',
      'kwpwwwwwwwwpwk', 'kwwwwwwwwwwwwk', 'kwwwwwwwwwwwwk', 'kwwwwwwwwwwwwk', 'kwwkwwwkwwwkwk', 'kwk.kwk.kwk.kk', '.k...k...k....'] },
    wand: { pal: { y: '#ffcf3f', Y: '#f08a3c', w: '#fffbe0' }, outline: true, rows: [
      '....y....', '...yYy...', 'yyyYwYyyy', '.yYwwwYy.', '..yYwYy..', '..yY.Yy..', '.yY...Yy.', '.y.....y.'] },
  };
  // 把像素陣列畫成小圖；outline = 自動在外圍加一圈深色描邊
  function pixelCanvas(W, H, getColor, outline) {
    const pad = outline ? 1 : 0, c = document.createElement('canvas');
    c.width = W + pad * 2; c.height = H + pad * 2;
    const g = c.getContext('2d');
    const at = (x, y) => (x >= 0 && y >= 0 && x < W && y < H) ? getColor(x, y) : null;
    for (let y = -pad; y < H + pad; y++) for (let x = -pad; x < W + pad; x++) {
      let col = at(x, y);
      if (!col && outline && [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([a, b]) => at(x + a, y + b))) col = '#2b1a12';
      if (col) { g.fillStyle = col; g.fillRect(x + pad, y + pad, 1, 1); }
    }
    return c;
  }
  const buildSprite = ({ pal, rows, outline }) => pixelCanvas(rows[0].length, rows.length, (x, y) => pal[rows[y][x]] || null, outline);

  // 墨水章魚大怪物：用程式一點一點畫出來（40×40 像素）
  function buildOctopus() {
    const S = 40, map = new Array(S * S).fill(null);
    const set = (x, y, col) => { if (x >= 0 && y >= 0 && x < S && y < S) map[y * S + x] = col; };
    for (let y = 2; y < 27; y++) for (let x = 5; x < 35; x++) {          // 圓圓的頭
      const dx = (x - 19.5) / 14, dy = (y - 14) / 12.5;
      if (dx * dx + dy * dy <= 1) set(x, y, (dx < -0.3 && dy < -0.25) ? '#c89af0' : (dx > 0.5 || dy > 0.62) ? '#6c3aa0' : '#9b59d0');
    }
    [7, 12, 17, 22, 27, 32].forEach((lx, i) => {                           // 六隻觸手
      for (let y = 23; y < 39; y++) {
        const off = Math.round(Math.sin((y - 23) / 3.5 + i * 1.3) * 1.6 + (i < 3 ? -1 : 1) * (y - 23) / 7);
        for (let w = -1; w <= 1; w++) set(lx + off + w, y, y > 35 ? '#6c3aa0' : '#9b59d0');
        if ((y - 25) % 4 === 0) set(lx + off, y, '#ffb3d9');
      }
    });
    for (const ex of [12, 23]) {                                            // 眼睛
      for (let y = 11; y < 17; y++) for (let x = ex; x < ex + 5; x++) set(x, y, '#ffffff');
      for (let y = 13; y < 17; y++) for (let x = ex + 1; x < ex + 4; x++) set(x, y, '#1b1b1b');
      set(ex + 1, 13, '#ffffff');
    }
    for (let i = 0; i < 6; i++) { set(11 + i, 8 + (i >> 1), '#3b1a5a'); set(28 - i, 8 + (i >> 1), '#3b1a5a'); }   // 生氣的眉毛
    for (let x = 17; x < 23; x++) set(x, 21, '#3b1a5a');
    set(16, 20, '#3b1a5a'); set(23, 20, '#3b1a5a');
    return pixelCanvas(S, S, (x, y) => map[y * S + x], true);
  }

  // ───────── 亂數 ─────────
  const rand = (a, b) => a + Math.random() * (b - a);
  const randi = (a, b) => Math.floor(rand(a, b + 1));
  const chance = p => Math.random() < p;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ───────── 台階繪製（預先畫到離屏畫布） ─────────
  const RES = 2;
  function makeBlock(w, h, biomeKey, floating) {
    const b = BIOMES[biomeKey];
    const pad = 6;
    const oc = document.createElement('canvas');
    oc.width = Math.ceil((w + pad * 2) * RES);
    oc.height = Math.ceil((h + pad * 2) * RES);
    const c = oc.getContext('2d');
    c.scale(RES, RES);
    c.translate(pad, pad);
    c.lineJoin = 'round';
    const r = floating ? 14 : 12;

    roundRect(c, 0, 0, w, h, r);
    c.fillStyle = b.body; c.fill();
    c.save(); c.clip();
    const grd = c.createLinearGradient(0, 0, 0, h);
    grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(60,25,0,.22)');
    c.fillStyle = grd; c.fillRect(0, 0, w, h);
    const n = Math.max(2, Math.floor(w * Math.min(h, 220) / 2600));
    for (let i = 0; i < n; i++) {
      const sx = rand(10, w - 10), sy = rand(30, Math.min(h, 220) - 8);
      if (biomeKey === 'grass') {
        const rw = rand(6, 14), rh = rw * rand(.55, .75);
        c.beginPath(); c.ellipse(sx, sy, rw, rh, 0, 0, Math.PI * 2);
        c.fillStyle = chance(.5) ? b.stone : b.bodyDark; c.fill();
        c.lineWidth = 2; c.strokeStyle = b.line; c.globalAlpha = .55; c.stroke(); c.globalAlpha = 1;
      } else {
        c.beginPath(); c.arc(sx, sy, rand(1.5, 3.2), 0, Math.PI * 2);
        c.fillStyle = b.bodyDark; c.fill();
      }
    }
    const capH = floating ? 18 : 22;
    c.beginPath();
    c.moveTo(-2, -2); c.lineTo(w + 2, -2); c.lineTo(w + 2, capH - 4);
    const waves = Math.max(2, Math.round(w / 26));
    const ww = (w + 4) / waves;
    for (let i = waves; i > 0; i--) {
      const x1 = -2 + i * ww, x0 = x1 - ww;
      c.quadraticCurveTo((x0 + x1) / 2, capH + 8, x0, capH - 4 + (i % 2 ? 0 : 2));
    }
    c.closePath();
    c.fillStyle = b.cap; c.fill();
    c.lineWidth = 3; c.strokeStyle = b.line; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.28)';
    c.fillRect(4, 3, w - 8, 4);
    c.restore();

    roundRect(c, 0, 0, w, h, r);
    c.lineWidth = 4; c.strokeStyle = b.line; c.stroke();

    const tufts = Math.floor(w / 110) + (chance(.5) ? 1 : 0);
    for (let i = 0; i < tufts; i++) {
      const tx = rand(14, w - 14);
      if (biomeKey === 'grass') drawTuft(c, tx, 1, b);
      else if (chance(.4)) drawShell(c, tx, 0, b);
      else drawTuft(c, tx, 1, { cap: '#5fbf55', capDark: '#3f9a3c', line: b.line });
    }
    return { canvas: oc, pad };
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  }
  function drawTuft(c, x, y, b) {
    c.beginPath();
    c.moveTo(x - 8, y);
    c.quadraticCurveTo(x - 9, y - 9, x - 5, y - 12);
    c.quadraticCurveTo(x - 3, y - 6, x - 1, y - 4);
    c.quadraticCurveTo(x, y - 14, x + 3, y - 16);
    c.quadraticCurveTo(x + 4, y - 8, x + 5, y - 5);
    c.quadraticCurveTo(x + 8, y - 11, x + 11, y - 11);
    c.quadraticCurveTo(x + 9, y - 4, x + 9, y);
    c.closePath();
    c.fillStyle = b.capDark; c.fill();
    c.lineWidth = 2.2; c.strokeStyle = b.line; c.stroke();
  }
  function drawShell(c, x, y, b) {
    c.beginPath();
    c.moveTo(x - 8, y); c.quadraticCurveTo(x - 9, y - 13, x, y - 13); c.quadraticCurveTo(x + 9, y - 13, x + 8, y);
    c.closePath();
    c.fillStyle = '#f7a6b8'; c.fill(); c.lineWidth = 2; c.strokeStyle = b.line; c.stroke();
    c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 11); c.moveTo(x - 4, y); c.lineTo(x - 5, y - 9); c.moveTo(x + 4, y); c.lineTo(x + 5, y - 9);
    c.lineWidth = 1.4; c.stroke();
  }

  // ───────── 世界生成（無限往右） ─────────
  // 收集物：小試身手區段是寶石，打敗第一隻大怪物之後才出現注音
  let platforms = [], items = [], enemies = [], particles = [], popups = [], flames = [];
  let qblocks = [], springs = [], spikes = [], decos = [], flags = [], bolts = [];
  let gen = null, boss = null, checkpoint = { x: 60, y: 420 };
  const KS = 45;                                   // Kenney 圖塊在世界裡的大小（18px → 45）

  function addPlatform(x, y, w, floating) {
    const h = floating ? randi(40, 52) : FLOOR - y;
    const biome = biomeAt(x + w / 2);
    const p = { x, y, w, h, floating, biome, art: makeBlock(w, h, biome, floating) };
    platforms.push(p);
    return p;
  }
  function addItemRow(x, y, n) {
    const zhuyin = x > gen.zhuyinFrom;
    for (let i = 0; i < n; i++) {
      items.push(zhuyin
        ? { kind: 'zhuyin', x: x + i * 38, y, ch: ZHUYIN[randi(0, ZHUYIN.length - 1)], t: Math.random() * 6 }
        : { kind: 'gem', x: x + i * 38, y, color: GEM_COLORS[randi(0, GEM_COLORS.length - 1)], t: Math.random() * 6 });
    }
  }

  // ───────── 怪物 ─────────
  // stomp：可以踩；magicOnly：只有魔法打得倒
  const ENEMY = {
    minion: { w: 62, h: 44, stomp: true, walker: true, name: '小綠怪' },
    slime:  { w: 56, h: 42, stomp: true, walker: true, name: '注音史萊姆' },
    bat:    { w: 58, h: 58, stomp: true, name: '蝙蝠' },
    spike:  { w: 54, h: 54, stomp: false, walker: true, name: '刺刺球' },
    block:  { w: 62, h: 62, stomp: false, name: '生氣方塊' },
    ghost:  { w: 56, h: 56, stomp: false, magicOnly: true, name: '害羞幽靈' },
  };
  function addEnemy(type, seg) {
    const d = ENEMY[type], e = { type, w: d.w, h: d.h, dir: -1, t: Math.random() * 6, dead: 0, vy: 0 };
    if (d.walker) Object.assign(e, { x: rand(seg.x + 20, seg.x + seg.w - d.w - 20), y: seg.y - d.h, groundY: seg.y,
                                     minX: seg.x + 6, maxX: seg.x + seg.w - d.w - 6, speed: type === 'spike' ? 85 : rand(45, 80), hop: rand(.4, 1.4), rot: 0 });
    if (type === 'bat') Object.assign(e, { baseX: seg.x + seg.w / 2, baseY: seg.y - rand(140, 185), range: rand(90, 170), x: seg.x + seg.w / 2, y: seg.y - 160 });
    if (type === 'block') Object.assign(e, { x: seg.x + seg.w / 2 - d.w / 2, baseY: seg.y - 230, y: seg.y - 230, groundY: seg.y, mode: 'wait', timer: 0 });
    if (type === 'ghost') Object.assign(e, { x: seg.x + seg.w * 0.7, y: seg.y - rand(110, 170), shy: false });
    enemies.push(e);
    return e;
  }
  // 越往前走，出現的怪物種類越多
  function pickEnemy(seg, meters, afterBoss) {
    const pool = [['minion', 1]];
    if (meters > 12) pool.push(['slime', 1]);
    if (meters > 25) pool.push(['bat', .9]);
    if (meters > 40) pool.push(['spike', .7]);
    if (meters > 55) pool.push(['block', .6]);
    if (afterBoss) pool.push(['ghost', .7]);
    const ok = pool.filter(([t]) => !(ENEMY[t].walker && seg.w < 260) && !(t === 'block' && seg.w < 180));
    let r = Math.random() * ok.reduce((a, [, w]) => a + w, 0);
    for (const [t, w] of ok) if ((r -= w) <= 0) return t;
    return null;
  }

  // ───────── 裝飾（不會擋路） ─────────
  function decorate(seg) {
    const beach = seg.biome === 'beach';
    const pool = beach ? [TILE.cactus, TILE.sprout, TILE.grass, TILE.mush] : [TILE.tree, TILE.sprout, TILE.grass, TILE.mush, TILE.fence];
    const n = Math.floor(seg.w / 160) + (chance(.5) ? 1 : 0);
    for (let i = 0; i < n; i++) {
      const tile = pool[randi(0, pool.length - 1)], size = tile === TILE.tree || tile === TILE.cactus ? 54 : 40;
      decos.push({ tile, x: rand(seg.x + 8, seg.x + seg.w - size - 8), y: seg.y - size + 4, size, flip: chance(.5) });
    }
  }

  function resetWorld() {
    platforms = []; items = []; enemies = []; particles = []; popups = []; flames = [];
    qblocks = []; springs = []; spikes = []; decos = []; flags = []; bolts = [];
    gen = { x: 900, y: 420, zhuyinFrom: Infinity, nextBossAt: BOSS_AT, bossCount: 0, nextFlagAt: 1800 };
    const start = addPlatform(-400, 420, 1300, false);       // 起點平地
    decorate(start);
    decos.push({ tile: TILE.sign, x: 170, y: 420 - KS + 4, size: KS });
    addItemRow(420, 360, 3);
    boss = null; checkpoint = { x: 60, y: 420 };
  }

  // 大怪物的競技場：一段長平地，怪物站在右邊；龍和墨水章魚輪流出現
  function placeBoss() {
    const ay = clamp(gen.y, 380, 440);
    const arena = addPlatform(gen.x, ay, 1150, false);
    const kind = gen.bossCount % 2 === 0 ? 'dragon' : 'octopus';
    const h = 230, w = kind === 'dragon' ? h * 447 / 520 : h;
    boss = { kind, img: kind === 'dragon' ? IMG.boss : IMG.octo, x: arena.x + 760, y: ay - h, w, h, state: 'idle', t: 0, hit: 0 };
    flags.push({ x: arena.x + 160, y: ay, on: false, t: 0 });     // 打怪前存檔
    gen.x = arena.x + arena.w;
    gen.y = ay;
    if (gen.zhuyinFrom === Infinity) gen.zhuyinFrom = boss.x + w;   // 第一隻大怪物之後開始出現注音
    gen.nextBossAt = gen.x + 5200;                                   // 約 100 公尺後再出現下一隻
    gen.nextFlagAt = gen.x + 1700;
    gen.bossCount++;
  }

  // 依跳躍能力（最高約 160、最遠約 220）設計，確保每一段都跳得過去
  function generateUntil(limitX) {
    while (gen.x < limitX) {
      if (gen.x >= gen.nextBossAt && (!boss || boss.state === 'defeated')) { placeBoss(); continue; }
      const roll = Math.random();
      let gap = 0;
      if (roll < 0.18) {
        gap = rand(230, 320);
        const fw = rand(100, 150);
        const fy = gen.y - rand(30, 90);
        const fx = gen.x + (gap - fw) / 2;
        addPlatform(fx, fy, fw, true);
        addItemRow(fx + fw / 2 - 19, fy - 50, 2);
        gen.lastFloatY = fy;
        if (fx > 1300 && chance(.35)) {                        // 坑洞上空有蝙蝠
          const e = addEnemy('bat', { x: fx - 60, y: fy + 40, w: fw + 120 });
          e.baseY = fy - 150;
        }
      } else if (roll < 0.55) {
        gap = rand(60, 140);
      }

      let ny = gen.y + (chance(.5) ? -rand(30, 95) : rand(20, 130));
      if (chance(.2)) ny = gen.y;
      ny = clamp(ny, 300, 470);
      const rise = gen.y - ny;
      if (rise > 0 && gap > 0 && gap < 200) gap = Math.min(gap, 150 - rise * 0.6);
      if (gen.lastFloatY !== undefined) ny = Math.max(ny, gen.lastFloatY - 80);
      gen.lastFloatY = undefined;

      const gx = gen.x + gap;
      const gw = rand(170, 520);
      const seg = addPlatform(gx, ny, gw, false);
      const meters = gx / 50, afterBoss = gx > gen.zhuyinFrom;
      decorate(seg);

      let busy = false;
      if (gx >= gen.nextFlagAt && gw > 200) {                  // 存檔旗子（這段不放怪物）
        flags.push({ x: gx + gw / 2, y: ny, on: false, t: 0 });
        gen.nextFlagAt = gx + 1700;
        busy = true;
      } else if (gx > 1300 && chance(.6)) {
        const t = pickEnemy(seg, meters, afterBoss);
        if (t) { addEnemy(t, seg); busy = true; }
      }
      if (!busy && meters > 35 && gw > 400 && chance(.25)) {   // 尖刺陷阱：放在中間，兩邊留路
        const n = randi(1, 2);
        spikes.push({ x: gx + gw / 2 - n * KS / 2, y: ny - KS, w: n * KS, h: KS });
      }

      if (chance(.35)) addItemRow(gx + rand(20, Math.max(30, gw - 140)), ny - 46, randi(2, 3));

      let floatingHere = false;
      if (chance(.55)) {
        floatingHere = true;
        let fw = rand(90, 190);
        let fx = gx + rand(-40, Math.max(-30, gw - fw + 30));
        let fy = ny - rand(105, 135);
        addPlatform(fx, fy, fw, true);
        if (chance(.6)) addItemRow(fx + fw / 2 - 38, fy - 46, 3);

        let level = 1;
        while (level < 3 && fy > 230 && chance(level === 1 ? .55 : .4)) {
          const nw = rand(80, 160);
          const dir = chance(.5) ? 1 : -1;
          const nx = dir > 0 ? fx + fw + rand(-20, 90) : fx - nw - rand(-20, 90);
          const nyF = Math.max(125, fy - rand(100, 125));
          addPlatform(nx, nyF, nw, true);
          addItemRow(nx + nw / 2 - 38, nyF - 46, 3);       // 越高獎勵越多
          fx = nx; fw = nw; fy = nyF; level++;
        }
      }
      if (!floatingHere && meters > 6 && gw > 170 && chance(.4)) {
        // 問號方塊：從下面頂會掉出寶石、愛心或魔杖
        const n = gw > 300 && chance(.4) ? 2 : 1;
        const bx = gx + rand(40, gw - 40 - n * KS);
        for (let i = 0; i < n; i++) qblocks.push({ x: bx + i * KS, y: ny - 195, w: KS, h: KS, used: false, bump: 0, floating: true });
      } else if (!floatingHere && meters > 18 && gw > 230 && chance(.2)) {
        // 彈簧蘑菇 + 高空獎勵台
        const sx = gx + gw * 0.3;
        springs.push({ x: sx, y: ny - KS, w: KS, h: KS, squash: 0 });
        const hy = Math.max(70, ny - 340);
        addPlatform(sx - 50, hy, 170, true);
        addItemRow(sx - 10, hy - 46, 3);
      }

      gen.x = gx + gw;
      gen.y = ny;
    }
  }

  function cleanup(camX) {
    const cut = Math.min(camX - 600, checkpoint.x - 500);   // 存檔點附近的地形要留著，跌倒時才回得去
    platforms = platforms.filter(p => p.x + p.w > cut);
    items = items.filter(c => !c.got && c.x > cut);
    enemies = enemies.filter(m => (m.x > cut || m.type === 'bat') && m.dead < 0.6 && (m.type !== 'bat' || m.baseX > cut));
    for (const k of ['qblocks', 'springs', 'spikes', 'decos', 'flags']) {
      const arr = { qblocks, springs, spikes, decos, flags }[k].filter(o => o.x + (o.w || o.size || 60) > cut);
      if (k === 'qblocks') qblocks = arr; else if (k === 'springs') springs = arr; else if (k === 'spikes') spikes = arr; else if (k === 'decos') decos = arr; else flags = arr;
    }
  }

  // ───────── 玩家 ─────────
  const P_W = 40, P_H = 72, MAX_HP = 3, MAGIC_TIME = 20;
  const player = {};
  function resetPlayer() {
    Object.assign(player, { x: 60, y: 420 - P_H, vx: 0, vy: 0, onGround: true, face: 1, coyote: 0, buffer: 0,
                            walkT: 0, squash: 1, blink: 0, safeX: 60, safeY: 420 - P_H, ground: null, hp: MAX_HP, magic: 0, shootCd: 0 });
  }

  // ───────── 輸入 ─────────
  const keys = { left: false, right: false, jump: false, magic: false };
  let jumpPressed = false, magicPressed = false;
  const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump', KeyX: 'magic', KeyK: 'magic' };
  addEventListener('keydown', e => {
    const k = KEYMAP[e.code];
    if (state === 'start' && (k || e.code === 'Enter')) { e.preventDefault(); startGame(); return; }
    if (state === 'boss-wait' && e.code === 'Enter') { startChallenge(); return; }
    if (!k) return;
    e.preventDefault();
    if (k === 'jump' && !keys.jump) jumpPressed = true;
    if (k === 'magic' && !keys.magic) magicPressed = true;
    keys[k] = true;
  });
  addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = false; });
  addEventListener('blur', () => { keys.left = keys.right = keys.jump = keys.magic = false; });

  document.querySelectorAll('.touch button').forEach(btn => {
    const k = btn.dataset.key;
    const down = e => { e.preventDefault(); if (state === 'start') startGame(); if (k === 'jump' && !keys.jump) jumpPressed = true; if (k === 'magic') magicPressed = true; keys[k] = true; btn.classList.add('on'); };
    const up = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('on'); };
    btn.addEventListener('pointerdown', down);
    btn.addEventListener('pointerup', up);
    btn.addEventListener('pointercancel', up);
    btn.addEventListener('pointerleave', up);
  });

  // ───────── 遊戲流程 ─────────
  // start → play → boss-intro（怪物吼叫）→ boss-wait（挑戰視窗）→ play（打敗後進入注音區）
  let state = 'start';
  const cam = { x: -60, shake: 0 };
  let gemCount = 0, coinCount = 0, bestX = 0;
  const magicPill = document.getElementById('magicPill'), magicT = document.getElementById('magicT'), magicBtn = document.querySelector('.touch .magic');
  const distEl = document.getElementById('dist'), gemEl = document.getElementById('gems'), coinEl = document.getElementById('coins');
  const startScreen = document.getElementById('startScreen'), bossScreen = document.getElementById('bossScreen');
  const toastEl = document.getElementById('toast');
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('challengeBtn').addEventListener('click', startChallenge);

  let toastTimer = 0;
  function toast(msg, sec = 2.2) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove('show'), sec * 1000);
  }

  function startGame() {
    if (state !== 'start') return;
    state = 'play';
    startScreen.classList.add('hidden');
    window.ZhuyinDuel.preload();
  }

  function startChallenge() {
    if (state !== 'boss-wait') return;
    bossScreen.classList.add('hidden');
    state = 'duel';
    window.ZhuyinDuel.open(boss.img, () => defeatBoss());
  }

  function saveGameRecord(extra = 0) {
    window.ZhuyinProgress && ZhuyinProgress.update('zhuyin-game', g => {
      g.bestDist = Math.max(g.bestDist || 0, Math.floor(Math.max(0, bestX) / 50));
      g.bestGems = Math.max(g.bestGems || 0, gemCount);
      g.bossWins = (g.bossWins || 0) + extra;
    });
  }
  addEventListener('pagehide', () => saveGameRecord());
  document.addEventListener('visibilitychange', () => document.hidden && saveGameRecord());

  function defeatBoss() {
    saveGameRecord(1);
    boss.state = 'defeated'; boss.t = 0;
    cam.shake = 0.4;
    for (let i = 0; i < 24; i++) particles.push({ x: boss.x + boss.w / 2, y: boss.y + boss.h / 2, vx: rand(-320, 320), vy: rand(-420, -60), t: 0, life: .9, star: true });
    state = 'play';
    document.getElementById('zhuyinPill').classList.remove('hidden');
    toast(gen.bossCount > 1 ? '又打敗一隻大怪物了！繼續往前冒險！' : '打敗大怪物了！接下來收集注音符號吧！', 3);
    player.hp = MAX_HP; renderHearts();
  }

  // ───────── 愛心、受傷、存檔點 ─────────
  const heartsEl = document.getElementById('hearts');
  function renderHearts(lost = -1) {
    heartsEl.innerHTML = Array.from({ length: MAX_HP }, (_, i) =>
      `<span class="heart ${i < player.hp ? '' : 'empty'} ${i === lost ? 'lose' : ''}"></span>`).join('');
  }
  function hurt(fromX) {
    const p = player;
    if (p.blink > 0 || state !== 'play') return;
    p.hp--; renderHearts(p.hp);
    const away = Math.sign((p.x + P_W / 2) - fromX) || -1;
    p.vx = away * 300; p.vy = -480; p.bounce = true; p.onGround = false; p.blink = 1.5;
    cam.shake = 0.2;
    if (p.hp <= 0) knockOut();
  }
  function knockOut() {
    const p = player;
    toast('小簡跌倒了！從 🚩 存檔點重新出發', 2.6);
    p.hp = MAX_HP; renderHearts();
    p.x = checkpoint.x; p.y = checkpoint.y - P_H; p.vx = 0; p.vy = 0; p.blink = 2; p.magic = 0;
    cam.x = Math.min(cam.x, checkpoint.x - viewW * 0.3);
    for (const e of enemies) if (Math.abs(e.x - checkpoint.x) < 260) e.x += 260;   // 不要一出生就撞到怪物
  }
  function killEnemy(e, byMagic) {
    e.dead = 0.001;
    gemCount++;
    popups.push({ x: e.x + e.w / 2, y: e.y, text: '+1', t: 0 });
    for (let i = 0; i < 10; i++) particles.push({ x: e.x + e.w / 2, y: e.y + e.h / 2, vx: rand(-200, 200), vy: rand(-260, -60), t: 0, life: .55, star: true, magic: byMagic });
  }
  function hitBlock(b) {
    b.bump = 0.18;
    if (b.used) return;
    b.used = true;
    const cx = b.x + b.w / 2;
    const r = Math.random();
    if (r < 0.22 && player.magic <= 0) items.push({ kind: 'wand', x: cx, y: b.y - 30, baseY: b.y - 34, rise: 0, t: 0 });
    else if (r < 0.45 && player.hp < MAX_HP) items.push({ kind: 'heart', x: cx, y: b.y - 30, baseY: b.y - 34, rise: 0, t: 0 });
    else {
      gemCount += 3;
      popups.push({ x: cx, y: b.y - 10, text: '+3', t: 0, small: true });
      for (let i = 0; i < 3; i++) particles.push({ x: cx, y: b.y, vx: (i - 1) * 90, vy: -420, t: 0, life: .7, gem: GEM_COLORS[randi(0, GEM_COLORS.length - 1)] });
    }
  }

  // ───────── 物理 ─────────
  const overlap = (ax, ay, aw, ah, b) => ax < b.x + b.w && ax + aw > b.x && ay < b.y + b.h && ay + ah > b.y;

  function step(dt) {
    const p = player;
    const control = state === 'play';
    const dir = control ? (keys.right ? 1 : 0) - (keys.left ? 1 : 0) : 0;
    const acc = p.onGround ? ACCEL : AIR_ACCEL;
    if (dir) {
      p.vx += dir * acc * dt;
      p.face = dir;
    } else if (p.onGround) {
      const f = FRICTION * dt;
      p.vx = Math.abs(p.vx) <= f ? 0 : p.vx - Math.sign(p.vx) * f;
    }
    p.vx = clamp(p.vx, -MAX_VX, MAX_VX);

    // 跳躍（土狼時間 + 預輸入緩衝 + 可變高度）
    p.coyote = p.onGround ? COYOTE : p.coyote - dt;
    if (jumpPressed && control) { p.buffer = BUFFER; }
    jumpPressed = false;
    p.buffer -= dt;
    if (p.buffer > 0 && p.coyote > 0) {
      p.vy = -JUMP_V; p.onGround = false; p.coyote = 0; p.buffer = 0; p.squash = 1.25;
      puff(p.x + P_W / 2, p.y + P_H, 5);
    }
    if (!keys.jump && p.vy < -260 && !p.bounce) p.vy = -260;   // 放開跳躍鍵 → 跳低一點
    if (p.vy >= 0) p.bounce = false;

    p.vy = Math.min(p.vy + G * dt, 1100);

    // X 軸
    p.x += p.vx * dt;
    if (p.x < cam.x + 4) { p.x = cam.x + 4; if (p.vx < 0) p.vx = 0; }   // 不能退出畫面左邊
    if (boss && boss.state !== 'defeated' && p.x + P_W > boss.x + 40) { p.x = boss.x + 40 - P_W; p.vx = Math.min(p.vx, 0); }
    for (const b of platforms) {
      if (b.floating) continue;
      if (overlap(p.x, p.y, P_W, P_H, b)) {
        if (p.vx > 0 || p.x + P_W / 2 < b.x + b.w / 2) p.x = b.x - P_W; else p.x = b.x + b.w;
        p.vx = 0;
      }
    }
    for (const b of qblocks) {
      if (overlap(p.x, p.y + 4, P_W, P_H - 8, b)) {
        if (p.x + P_W / 2 < b.x + b.w / 2) p.x = b.x - P_W; else p.x = b.x + b.w;
        p.vx = 0;
      }
    }

    // Y 軸
    const prevBottom = p.y + P_H;
    p.y += p.vy * dt;
    const wasGround = p.onGround;
    p.onGround = false;
    for (const b of platforms) {
      if (p.x + P_W <= b.x + 2 || p.x >= b.x + b.w - 2) continue;
      if (b.floating) {
        if (p.vy >= 0 && prevBottom <= b.y + 1 && p.y + P_H >= b.y) land(b);   // 單向台階
      } else if (overlap(p.x, p.y, P_W, P_H, b)) {
        if (p.vy >= 0 && prevBottom <= b.y + 12) land(b);
        else if (p.vy < 0) { p.y = b.y + b.h; p.vy = 0; }
      }
    }
    for (const b of qblocks) {
      if (!overlap(p.x + 4, p.y, P_W - 8, P_H, b)) continue;
      if (p.vy >= 0 && prevBottom <= b.y + 12) land(b);
      else if (p.vy < 0) { p.y = b.y + b.h; p.vy = 0; hitBlock(b); }
    }
    function land(b) {
      p.y = b.y - P_H; p.vy = 0; p.onGround = true; p.ground = b;
      if (!wasGround) { p.squash = 0.78; puff(p.x + P_W / 2, b.y, 4); }
    }

    if (p.onGround && !p.ground.floating && p.x > p.ground.x && p.x + P_W < p.ground.x + p.ground.w) {
      p.safeX = p.x; p.safeY = p.y;
    }

    // 掉進坑洞 → 回到畫面內最近的地面
    if (p.y > VIEW_H + 120) {
      const minX = cam.x + 30;
      const g = platforms
        .filter(b => !b.floating && b.x + b.w - P_W - 10 > minX)
        .sort((a, b) => Math.abs(Math.max(a.x + 10, minX) - p.safeX) - Math.abs(Math.max(b.x + 10, minX) - p.safeX))[0];
      p.x = Math.min(Math.max(g.x + 10, minX, p.safeX), g.x + g.w - P_W - 10);
      p.y = g.y - P_H; p.vx = 0; p.vy = 0; p.blink = 1.2; p.onGround = true; p.ground = g;
      p.hp--; renderHearts(p.hp);
      if (p.hp <= 0) knockOut();
    }

    // ───── 怪物 ─────
    const pcx = p.x + P_W / 2;
    for (const e of enemies) {
      if (e.dead) { e.dead += dt; continue; }
      e.t += dt;
      const d = ENEMY[e.type];
      if (d.walker) {
        e.x += e.dir * e.speed * dt;
        if (e.x < e.minX) { e.x = e.minX; e.dir = 1; }
        if (e.x > e.maxX) { e.x = e.maxX; e.dir = -1; }
        if (e.type === 'spike') e.rot += e.dir * e.speed * dt / 26;
        if (e.type === 'slime') {                       // 史萊姆一跳一跳
          e.hop -= dt;
          if (e.hop <= 0 && e.y + e.h >= e.groundY) { e.vy = -rand(380, 520); e.hop = rand(.9, 1.6); }
          e.vy += G * 0.8 * dt; e.y += e.vy * dt;
          if (e.y + e.h >= e.groundY) { e.y = e.groundY - e.h; e.vy = 0; }
        }
      } else if (e.type === 'bat') {
        const prev = e.x;
        e.x = e.baseX + Math.sin(e.t * 0.9) * e.range - e.w / 2;
        e.y = e.baseY + Math.sin(e.t * 3.2) * 28;
        e.dir = e.x < prev ? -1 : 1;
      } else if (e.type === 'block') {                  // 生氣方塊：小簡走到下面就砸下來
        if (e.mode === 'wait' && Math.abs(pcx - (e.x + e.w / 2)) < 75 && p.y > e.y) { e.mode = 'fall'; e.vy = 0; }
        if (e.mode === 'fall') {
          e.vy += 2800 * dt; e.y += e.vy * dt;
          if (e.y + e.h >= e.groundY) { e.y = e.groundY - e.h; e.mode = 'land'; e.timer = .9; cam.shake = Math.max(cam.shake, .12); puff(e.x + e.w / 2, e.groundY, 6); }
        } else if (e.mode === 'land') { e.timer -= dt; if (e.timer <= 0) e.mode = 'rise'; }
        else if (e.mode === 'rise') { e.y -= 110 * dt; if (e.y <= e.baseY) { e.y = e.baseY; e.mode = 'wait'; } }
      } else if (e.type === 'ghost') {                  // 害羞幽靈：小簡看著牠就停下來遮臉
        const dx = pcx - (e.x + e.w / 2), dy = (p.y + 20) - (e.y + e.h / 2);
        e.shy = Math.sign(-dx) === p.face && Math.abs(dx) < viewW;
        if (!e.shy && Math.abs(dx) < viewW * 0.9) {
          const len = Math.hypot(dx, dy) || 1;
          e.x += dx / len * 62 * dt; e.y += dy / len * 62 * dt;
          e.y = clamp(e.y, 60, VIEW_H - 140);
        }
        e.dir = dx < 0 ? -1 : 1;
      }

      const hb = { x: e.x + 8, y: e.y + 8, w: e.w - 16, h: e.h - 10 };
      if (!overlap(p.x, p.y, P_W, P_H, hb)) continue;
      const fromAbove = p.vy > 0 && prevBottom <= hb.y + 14;
      if (fromAbove && d.stomp) {
        killEnemy(e, false);
        p.vy = keys.jump ? -720 : -520; p.bounce = true; p.squash = 1.2;
      } else if (fromAbove && e.type === 'block') {   // 踩在方塊上只會彈開
        p.vy = -560; p.bounce = true;
      } else hurt(e.x + e.w / 2);
    }

    // ───── 魔法 ─────
    p.magic = Math.max(0, p.magic - dt);
    p.shootCd -= dt;
    if (magicPressed && control) {
      if (p.magic > 0 && p.shootCd <= 0) {
        bolts.push({ x: pcx + p.face * 26, y: p.y + 30, vx: p.face * 600, t: 0 });
        p.shootCd = 0.3;
      } else if (p.magic <= 0) toast('先從 ❓ 方塊找到魔杖 🪄 才能發射魔法喔！', 2);
    }
    magicPressed = false;
    for (const b of bolts) {
      b.t += dt; b.x += b.vx * dt;
      if (Math.random() < dt * 30) particles.push({ x: b.x, y: b.y + rand(-6, 6), vx: -b.vx * .1, vy: rand(-30, 30), t: 0, life: .3, star: true, magic: true });
      for (const e of enemies) {
        if (e.dead || b.t > 9) continue;
        if (overlap(b.x - 10, b.y - 10, 20, 20, e)) { killEnemy(e, true); b.t = 9; }
      }
      if (platforms.some(pl => !pl.floating && overlap(b.x - 6, b.y - 6, 12, 12, pl))) b.t = 9;
    }
    bolts = bolts.filter(b => b.t < 0.9);

    // ───── 彈簧、尖刺、存檔旗子 ─────
    for (const sp of springs) {
      sp.squash = Math.max(0, sp.squash - dt);
      if (p.vy > 0 && prevBottom <= sp.y + 16 && p.y + P_H >= sp.y + 10 && p.x + P_W > sp.x + 6 && p.x < sp.x + sp.w - 6) {
        p.y = sp.y + 10 - P_H; p.vy = -1300; p.bounce = true; p.onGround = false; p.squash = 1.3; sp.squash = .25;
        puff(sp.x + sp.w / 2, sp.y + 10, 6);
      }
    }
    for (const sk of spikes) {
      if (overlap(p.x, p.y, P_W, P_H, { x: sk.x + 6, y: sk.y + sk.h * 0.5, w: sk.w - 12, h: sk.h * 0.5 })) {
        if (p.blink <= 0) { hurt(sk.x + sk.w / 2); p.vy = -620; }
      }
    }
    for (const f of flags) {
      f.t += dt;
      if (!f.on && Math.abs(pcx - f.x) < 34 && p.y + P_H > f.y - 100 && p.y < f.y) {
        f.on = true; checkpoint = { x: f.x - P_W / 2, y: f.y };
        if (p.hp < MAX_HP) { p.hp++; renderHearts(); }
        toast('🚩 存檔點！跌倒會從這裡重新出發', 2);
        for (let i = 0; i < 12; i++) particles.push({ x: f.x, y: f.y - 80, vx: rand(-160, 160), vy: rand(-260, -40), t: 0, life: .6, star: true });
      }
    }
    for (const b of qblocks) b.bump = Math.max(0, b.bump - dt);

    // 大怪物出現
    if (boss) {
      boss.t += dt;
      boss.hit = Math.max(0, boss.hit - dt);
      if (boss.state === 'idle' && p.x + P_W > boss.x - 330 && state === 'play') {
        boss.state = 'roar'; boss.t = 0; state = 'boss-intro';
        p.vx = 0;
      }
      if (boss.state === 'roar') {
        cam.shake = Math.max(cam.shake, boss.t < 1.4 ? 0.12 : 0);
        if (boss.t > 0.3 && boss.t < 1.4 && Math.random() < dt * 9) {
          if (boss.kind === 'octopus') flames.push({ ink: true, x: boss.x + boss.w * 0.3, y: boss.y + boss.h * 0.55 + rand(-14, 14), vx: rand(-380, -250), vy: rand(-80, 40), t: 0, life: .8, rot: 0, r: rand(8, 15) });
          else flames.push({ x: boss.x + boss.w * 0.08, y: boss.y + boss.h * 0.55 + rand(-12, 12), vx: rand(-360, -240), vy: rand(-30, 30), t: 0, life: .7, rot: rand(0, 6) });
        }
        if (boss.t > 1.8 && state === 'boss-intro') {
          state = 'boss-wait';
          bossScreen.classList.remove('hidden');
        }
      }
    }
    for (const f of flames) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += dt * 6; }
    flames = flames.filter(f => f.t < f.life);

    // 走路動畫
    if (p.onGround && Math.abs(p.vx) > 20) {
      p.walkT += dt * (6 + Math.abs(p.vx) / 32);
      if (Math.random() < dt * 6) puff(p.x + P_W / 2 - p.face * 14, p.y + P_H, 1);
    } else if (p.onGround) p.walkT += (Math.round(p.walkT / Math.PI) * Math.PI - p.walkT) * Math.min(1, dt * 12);
    p.squash += (1 - p.squash) * Math.min(1, dt * 10);
    p.blink = Math.max(0, p.blink - dt);

    // 收集寶石 / 注音
    for (const c of items) {
      if (c.got) continue;
      c.t += dt;
      if (c.baseY !== undefined) { c.rise = Math.min(1, c.rise + dt * 4); c.y = c.baseY + 30 * (1 - c.rise); }
      if (Math.abs(c.x - (p.x + P_W / 2)) < 34 && Math.abs(c.y - (p.y + P_H / 2)) < 46) {
        c.got = true;
        if (c.kind === 'heart') { drawTile(TILE.heart, c.x - 20, y - 20, 40); continue; }
      if (c.kind === 'wand') {
        ctx.save(); ctx.imageSmoothingEnabled = false; ctx.translate(c.x, y); ctx.rotate(Math.sin(c.t * 3) * 0.3);
        if (IMG.wand) ctx.drawImage(IMG.wand, -20, -20, 40, 40);
        ctx.restore(); continue;
      }
      if (c.kind === 'gem') { gemCount++; popups.push({ x: c.x, y: c.y, text: '+1', t: 0, small: true }); }
        else if (c.kind === 'heart') { p.hp = Math.min(MAX_HP, p.hp + 1); renderHearts(); popups.push({ x: c.x, y: c.y, text: '❤', t: 0 }); }
        else if (c.kind === 'wand') { p.magic = MAGIC_TIME; toast('🪄 拿到魔杖！按 X 發射魔法，什麼怪物都打得倒', 2.6); }
        else { coinCount++; popups.push({ x: c.x, y: c.y, text: c.ch, t: 0 }); }
        for (let i = 0; i < 8; i++) particles.push({ x: c.x, y: c.y, vx: rand(-160, 160), vy: rand(-220, -40), t: 0, life: .5, star: true });
      }
    }

    // 粒子
    for (const q of particles) { q.t += dt; q.x += q.vx * dt; q.y += q.vy * dt; q.vy += (q.star || q.gem ? 600 : -30) * dt; }
    particles = particles.filter(q => q.t < q.life);
    for (const q of popups) q.t += dt;
    popups = popups.filter(q => q.t < 1.1);

    // 鏡頭：只往前（像瑪利歐）；大怪物出現時把牠帶進畫面
    let target = p.x - viewW * 0.38;
    if (boss && (state === 'boss-intro' || state === 'boss-wait')) target = Math.max(target, boss.x + boss.w + 60 - viewW);
    if (target > cam.x) cam.x += (target - cam.x) * Math.min(1, dt * (state === 'play' ? 8 : 3));
    cam.shake = Math.max(0, cam.shake - dt);

    bestX = Math.max(bestX, p.x);
    generateUntil(cam.x + viewW + 900);
    cleanup(cam.x);
  }

  function puff(x, y, n) {
    for (let i = 0; i < n; i++) particles.push({ x: x + rand(-10, 10), y: y - rand(0, 6), vx: rand(-60, 60), vy: rand(-50, -10), t: 0, life: rand(.3, .55), r: rand(4, 8) });
  }

  // ───────── 繪圖 ─────────
  const BG_CROP = 0.72;     // 只用場景圖上半部（天空、山、樹），地面由程式畫
  const BG_H = 470;

  function drawBiomeBg(key, alpha) {
    const b = BIOMES[key], img = b.img;
    ctx.globalAlpha = alpha;
    const g = ctx.createLinearGradient(0, BG_H - 30, 0, VIEW_H);
    g.addColorStop(0, b.fillTop); g.addColorStop(1, b.fillBot);
    ctx.fillStyle = g; ctx.fillRect(0, BG_H - 30, viewW + 2, VIEW_H - BG_H + 32);
    if (img) {
      const sh = img.height * BG_CROP;
      const bw = img.width * BG_H / sh;
      const off = cam.x * 0.35;
      const first = Math.floor(off / bw);
      for (let i = first; i * bw - off < viewW; i++) {
        const x = i * bw - off;
        if (i % 2) {
          ctx.save(); ctx.translate(x + bw, 0); ctx.scale(-1, 1);
          ctx.drawImage(img, 0, 0, img.width, sh, 0, 0, bw + 1, BG_H);
          ctx.restore();
        } else ctx.drawImage(img, 0, 0, img.width, sh, x - 0.5, 0, bw + 1, BG_H);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawGem(x, y, s, color) {
    ctx.beginPath();
    ctx.moveTo(x, y - 15 * s); ctx.lineTo(x + 14 * s, y - 4 * s); ctx.lineTo(x, y + 15 * s); ctx.lineTo(x - 14 * s, y - 4 * s); ctx.closePath();
    ctx.fillStyle = color[0]; ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 14 * s, y - 4 * s); ctx.lineTo(x + 14 * s, y - 4 * s); ctx.lineTo(x, y + 15 * s); ctx.closePath();
    ctx.fillStyle = color[1]; ctx.globalAlpha *= .55; ctx.fill(); ctx.globalAlpha /= .55;
    ctx.beginPath();
    ctx.moveTo(x, y - 15 * s); ctx.lineTo(x + 14 * s, y - 4 * s); ctx.lineTo(x, y + 15 * s); ctx.lineTo(x - 14 * s, y - 4 * s); ctx.closePath();
    ctx.lineWidth = 3; ctx.strokeStyle = '#3b2414'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - 5 * s, y - 9 * s); ctx.lineTo(x - 1 * s, y - 11 * s); ctx.lineTo(x - 7 * s, y - 4 * s); ctx.closePath();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.fill();
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingQuality = 'high';

    // 背景：依目前位置在草地 / 沙灘間淡入淡出
    const mid = cam.x + viewW / 2;
    const seg = Math.max(0, mid) / BIOME_LEN;
    const idx = Math.floor(seg), frac = seg - idx;
    const cur = BIOME_ORDER[idx % BIOME_ORDER.length], nxt = BIOME_ORDER[(idx + 1) % BIOME_ORDER.length];
    const fade = clamp((frac - 0.9) / 0.1, 0, 1);
    drawBiomeBg(cur, 1);
    if (fade > 0) drawBiomeBg(nxt, fade);

    ctx.save();
    const sx = cam.shake > 0 ? rand(-5, 5) : 0, sy = cam.shake > 0 ? rand(-4, 4) : 0;
    ctx.translate(-cam.x + sx, sy);

    // 台階
    for (const p of platforms) {
      if (p.x > cam.x + viewW + 20 || p.x + p.w < cam.x - 20) continue;
      const a = p.art;
      if (p.floating) {
        ctx.fillStyle = 'rgba(30,40,60,.13)';
        ctx.beginPath(); ctx.ellipse(p.x + p.w / 2, p.y + p.h + 14, p.w * 0.42, 6, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.drawImage(a.canvas, p.x - a.pad, p.y - a.pad, p.w + a.pad * 2, p.h + a.pad * 2);
    }
    // 裝飾、尖刺、彈簧、問號方塊、存檔旗子（Kenney 像素素材）
    const vis = o => o.x < cam.x + viewW + 60 && o.x + (o.w || o.size) > cam.x - 60;
    for (const d of decos) if (vis(d)) drawTile(d.tile, d.x, d.y, d.size, d.flip);
    for (const sk of spikes) if (vis(sk)) for (let x = sk.x; x < sk.x + sk.w - 1; x += KS) drawTile(TILE.spikes, x, sk.y + 4, KS);
    for (const sp of springs) if (vis(sp)) {
      ctx.save(); ctx.translate(sp.x + sp.w / 2, sp.y + sp.h); ctx.scale(1 + sp.squash, 1 - sp.squash * 1.6);
      drawTile(TILE.spring, -sp.w / 2, -sp.h, sp.w); ctx.restore();
    }
    for (const b of qblocks) if (vis(b)) {
      const dy = -Math.sin(Math.min(1, b.bump / 0.18) * Math.PI) * 10;
      drawTile(b.used ? TILE.used : TILE.qblock, b.x, b.y + dy, b.w);
    }
    for (const f of flags) if (vis({ x: f.x - 30, w: 60 })) {
      ctx.save(); ctx.globalAlpha = f.on ? 1 : 0.75;
      drawTile(TILE.pole, f.x - KS / 2, f.y - KS, KS);
      drawTile(f.on && Math.floor(f.t * 4) % 2 ? TILE.flag2 : TILE.flag, f.x - KS / 2, f.y - KS * 2, KS);
      ctx.restore();
    }

    // 寶石 / 注音
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const c of items) {
      if (c.got || c.x < cam.x - 40 || c.x > cam.x + viewW + 40) continue;
      const y = c.y + Math.sin(c.t * 3) * 4;
      if (c.kind === 'gem') {
        const s = 1 + Math.sin(c.t * 4) * 0.04;
        drawGem(c.x, y, s, c.color);
        if ((c.t * 1.3) % 3 < 0.25) {   // 偶爾閃一下
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(c.x + 8, y - 10, 2.5, 0, Math.PI * 2); ctx.fill();
        }
        continue;
      }
      const sxc = Math.abs(Math.cos(c.t * 1.6)) * 0.35 + 0.65;
      ctx.save(); ctx.translate(c.x, y); ctx.scale(sxc, 1);
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2);
      ctx.fillStyle = '#ffd34d'; ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = '#3b2414'; ctx.stroke();
      ctx.beginPath(); ctx.arc(-4, -5, 5, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
      ctx.fillStyle = '#7a3b10'; ctx.font = '22px "Cubic 11","PingFang TC",sans-serif';
      ctx.fillText(c.ch, 0, 1.5);
      ctx.restore();
    }

    // 怪物
    for (const e of enemies) {
      if (e.x > cam.x + viewW + 60 || e.x + e.w < cam.x - 60) continue;
      ctx.save();
      ctx.globalAlpha = e.dead ? Math.max(0, 1 - e.dead * 1.6) : 1;
      const squash = e.dead ? Math.max(0.15, 1 - e.dead * 4) : 1;
      ctx.translate(e.x + e.w / 2, e.y + e.h);
      ctx.scale(1, squash);
      const W = e.w, H = e.h;
      ctx.imageSmoothingEnabled = e.type === 'minion';
      if (e.type === 'minion') {
        ctx.scale(e.dir > 0 ? -1 : 1, 1 + Math.sin(e.t * 10) * 0.05);      // 原圖面向左
        if (IMG.minion) ctx.drawImage(IMG.minion, -W / 2 - 4, -H - 4, W + 8, H + 6);
      } else if (e.type === 'slime') {
        const air = e.vy < 0 ? 1.15 : e.vy > 0 ? 1.05 : 0.92 + Math.abs(Math.sin(e.t * 5)) * 0.06;
        ctx.scale(1 / Math.sqrt(air), air);
        if (IMG.slime) ctx.drawImage(IMG.slime, -W / 2, -H, W, H);
      } else if (e.type === 'bat') {
        drawChar(CHAR.bat[Math.floor(e.t * 9) % 3], -W / 2, -H, W, e.dir > 0);
      } else if (e.type === 'spike') {
        ctx.translate(0, -H / 2); ctx.rotate(e.rot);
        drawChar(CHAR.spike, -W / 2, -H / 2, W);
      } else if (e.type === 'block') {
        drawChar(e.mode === 'wait' ? CHAR.blockCalm : CHAR.blockMad, -W / 2, -H, W);
      } else if (e.type === 'ghost') {
        ctx.globalAlpha *= e.shy ? 0.6 : 0.88;
        ctx.translate(0, Math.sin(e.t * 2.5) * 4);
        if (e.dir < 0) ctx.scale(-1, 1);
        const img = e.shy ? IMG.ghostShy : IMG.ghost;
        if (img) ctx.drawImage(img, -W / 2, -H, W, H);
      }
      ctx.restore();
    }

    // 魔法彈
    for (const b of bolts) {
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.t * 14);
      ctx.imageSmoothingEnabled = false;
      if (IMG.wand) ctx.drawImage(IMG.wand, -14, -14, 28, 28);
      ctx.restore();
    }

    // 大怪物
    if (boss && boss.x < cam.x + viewW + 300) {
      let a = 1, s = 1, dy = 0, rot = 0;
      if (boss.state === 'roar') s = 1 + Math.sin(Math.min(boss.t, 1.4) / 1.4 * Math.PI) * 0.08;
      else if (boss.state === 'idle') s = 1 + Math.sin(boss.t * 2.2) * 0.015;
      if (boss.state === 'defeated') {
        const k = Math.min(1, boss.t / 1.2);
        a = 1 - k; s = 1 - k * 0.6; rot = k * 1.2; dy = -k * 160;
      }
      if (a > 0.01) {
        ctx.save(); ctx.globalAlpha = a;
        ctx.fillStyle = 'rgba(30,20,10,.2)';
        ctx.beginPath(); ctx.ellipse(boss.x + boss.w * 0.62, boss.y + boss.h, boss.w * 0.4, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.translate(boss.x + boss.w / 2, boss.y + boss.h + dy);
        ctx.rotate(rot); ctx.scale(s, s);
        ctx.imageSmoothingEnabled = boss.kind !== 'octopus';
        if (boss.img) ctx.drawImage(boss.img, -boss.w / 2, -boss.h, boss.w, boss.h);
        ctx.restore();
      }
      if (boss.state === 'idle' && boss.x - cam.x < viewW + 40) {
        ctx.fillStyle = '#c0392b'; ctx.font = '30px "Cubic 11","PingFang TC",sans-serif';
        ctx.fillText('!', boss.x + boss.w * 0.4, boss.y - 18 + Math.sin(boss.t * 5) * 4);
      }
    }
    for (const f of flames) {
      const k = f.t / f.life;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      const s = 34 + k * 30;
      if (f.ink) { ctx.fillStyle = '#3b1a5a'; const r = Math.round(f.r * (1 + k)); ctx.fillRect(-r, -r, r * 2, r * 2); ctx.fillStyle = '#6c3aa0'; ctx.fillRect(-r + 3, -r + 3, r, r); }
      else if (IMG.fire) ctx.drawImage(IMG.fire, -s / 2, -s * 0.72, s, s * 1.45);
      ctx.restore();
    }

    // 粒子
    for (const q of particles) {
      const k = 1 - q.t / q.life;
      ctx.globalAlpha = k;
      if (q.gem) drawGem(q.x, q.y, 0.8, q.gem);
      else if (q.star) { ctx.fillStyle = q.magic ? '#c792ea' : '#ffe680'; const r = Math.ceil(3.5 * k + 1.5); ctx.fillRect(q.x - r, q.y - r, r * 2, r * 2); }
      else { ctx.fillStyle = '#fffaf0'; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * (0.6 + 0.6 * (1 - k)), 0, Math.PI * 2); ctx.fill(); }
    }
    ctx.globalAlpha = 1;

    drawPlayer();

    // 跳出的文字
    for (const q of popups) {
      const k = q.t / 1.1;
      ctx.globalAlpha = 1 - k * k;
      ctx.font = `${(q.small ? 22 : 34) + k * 10}px "Cubic 11","PingFang TC",sans-serif`;
      ctx.lineWidth = 6; ctx.strokeStyle = '#fffaeb';
      ctx.strokeText(q.text, q.x, q.y - 30 - k * 50);
      ctx.fillStyle = '#d0552b';
      ctx.fillText(q.text, q.x, q.y - 30 - k * 50);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    distEl.textContent = Math.floor(Math.max(0, bestX) / 50);
    gemEl.textContent = gemCount;
    coinEl.textContent = coinCount;
    const m = Math.ceil(player.magic);
    magicPill.classList.toggle('hidden', m <= 0);
    magicBtn.hidden = m <= 0;
    if (m > 0) magicT.textContent = m;
  }

  function drawPlayer() {
    const p = player;
    if (p.blink > 0 && Math.floor(p.blink * 12) % 2) return;
    const walking = p.onGround && Math.abs(p.vx) > 20;
    const bob = walking ? Math.abs(Math.sin(p.walkT)) * 5 : 0;
    const tilt = walking ? Math.sin(p.walkT) * 0.07 : (p.onGround ? 0 : clamp(p.vy / 4000, -0.12, 0.12));
    const img = IMG.player;
    const DH = 92, DW = img ? DH * img.width / img.height : 78;
    const sy = p.squash, sx = 1 / Math.sqrt(sy);
    const footX = p.x + P_W / 2, footY = p.y + P_H;

    if (p.onGround) {
      ctx.fillStyle = 'rgba(30,20,10,.18)';
      ctx.beginPath(); ctx.ellipse(footX, footY, 24 - bob, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.save();
    ctx.translate(footX, footY - bob);
    ctx.rotate(tilt * p.face);
    ctx.scale(sx * p.face, sy);
    if (img) ctx.drawImage(img, -DW / 2, -DH + 2, DW, DH);
    else { ctx.fillStyle = '#7a7ac0'; ctx.fillRect(-P_W / 2, -P_H, P_W, P_H); }
    ctx.restore();
  }

  // ───────── 開始畫面的怪物圖鑑 ─────────
  function renderBestiary() {
    const list = [
      ['minion', '可以踩', 'ok'], ['slime', '可以踩，會跳', 'ok'], ['bat', '可以踩，會飛', 'ok'],
      ['spike', '不能踩！跳過去', 'no'], ['block', '會砸下來！', 'no'], ['ghost', '看著牠就不動，只怕魔法', 'no'],
    ];
    const box = document.getElementById('bestiary');
    box.innerHTML = '';
    for (const [type, tip, cls] of list) {
      const div = document.createElement('div'), c = document.createElement('canvas');
      c.width = c.height = 48;
      const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
      const sheet = (img, cols, cell, i) => g.drawImage(img, (i % cols) * cell, Math.floor(i / cols) * cell, cell, cell, 0, 0, 48, 48);
      if (type === 'minion' && IMG.minion) { g.imageSmoothingEnabled = true; g.drawImage(IMG.minion, 0, 10, 48, 34); }
      if (type === 'slime') g.drawImage(IMG.slime, 0, 8, 48, 36);
      if (type === 'ghost') g.drawImage(IMG.ghost, 3, 3, 42, 42);
      if (type === 'bat' && IMG.chars) sheet(IMG.chars, 9, 24, CHAR.bat[0]);
      if (type === 'spike' && IMG.chars) sheet(IMG.chars, 9, 24, CHAR.spike);
      if (type === 'block' && IMG.chars) sheet(IMG.chars, 9, 24, CHAR.blockMad);
      div.append(c);
      div.insertAdjacentHTML('beforeend', `<b>${ENEMY[type].name}</b><span class="${cls}">${tip}</span>`);
      box.append(div);
    }
  }

  // ───────── 主迴圈 ─────────
  let last = performance.now(), acc = 0;
  const STEP = 1 / 120;
  window.__game = { player, cam, keys, get platforms() { return platforms; }, get minions() { return enemies; }, get enemies() { return enemies; }, get qblocks() { return qblocks; }, get springs() { return springs; }, get spikes() { return spikes; }, get flags() { return flags; }, get bolts() { return bolts; }, addEnemy, hitBlock, hurt, get checkpoint() { return checkpoint; }, press(k) { if (k === 'magic') magicPressed = true; }, get boss() { return boss; },
                    get state() { return state; }, tick(sec) { for (let i = 0; i < sec * 120; i++) step(STEP); draw(); } };   // 除錯用
  function frame(now) {
    acc += Math.min(0.1, (now - last) / 1000);
    last = now;
    while (acc >= STEP) {
      if (state !== 'start') step(STEP);
      else for (const c of items) c.t += STEP;
      acc -= STEP;
    }
    draw();
    requestAnimationFrame(frame);
  }

  Promise.all([load('assets/xiaojian_pixel.png'), load(BIOMES.grass.src), load(BIOMES.beach.src),
               load('assets/boss.png'), load('assets/minion.png'), load('assets/fire.png'),
               load('assets/kenney/tiles.png'), load('assets/kenney/chars.png')]).then(([pi, g, b, bo, mi, fi, kt, kc]) => {
    IMG.player = pi; IMG.boss = cleanBoss(bo); IMG.minion = mi; IMG.fire = fi; IMG.tiles = kt; IMG.chars = kc;
    IMG.slime = buildSprite(PIX.slime); IMG.ghost = buildSprite(PIX.ghost); IMG.ghostShy = buildSprite(PIX.ghostShy);
    IMG.wand = buildSprite(PIX.wand); IMG.octo = buildOctopus();
    renderBestiary();
    BIOMES.grass.img = g; BIOMES.beach.img = b;
    resetWorld(); resetPlayer(); renderHearts();
    generateUntil(viewW + 1200);
    requestAnimationFrame(frame);
  });
})();
</script>

<script src="js/progress.js"></script>
<script src="js/airwriter.js"></script>
<script>
// ═════════ 注音魔法對決：手勢偵測空中寫字（共用 js/airwriter.js） ═════════
window.ZhuyinDuel = (() => {
  // 題目：圖 + 詞，寫出第一個字的聲母（或介音）
  const WORDS = [
    ['ㄅ', '👨', '爸爸'], ['ㄆ', '🍇', '葡萄'], ['ㄇ', '👩', '媽媽'], ['ㄈ', '✈️', '飛機'], ['ㄉ', '🐘', '大象'],
    ['ㄊ', '🐰', '兔子'], ['ㄋ', '🐮', '牛奶'], ['ㄌ', '🐯', '老虎'], ['ㄍ', '🐶', '狗狗'], ['ㄎ', '🦖', '恐龍'],
    ['ㄏ', '🌸', '花朵'], ['ㄐ', '🐔', '雞蛋'], ['ㄑ', '🐧', '企鵝'], ['ㄒ', '🍉', '西瓜'], ['ㄓ', '🕷️', '蜘蛛'],
    ['ㄔ', '🚗', '車子'], ['ㄕ', '🦁', '獅子'], ['ㄖ', '🌭', '熱狗'], ['ㄗ', '⚽', '足球'], ['ㄘ', '🍓', '草莓'],
    ['ㄙ', '🐿️', '松鼠'], ['ㄧ', '👕', '衣服'], ['ㄨ', '🐢', '烏龜'], ['ㄩ', '🐟', '魚'],
  ];
  const ROUNDS = 3;
  const { Recognizer, Pad, speak } = window.AirWriter;

  const $ = id => document.getElementById(id);
  const screen = $('duelScreen'), feedback = $('feedback'), guide = $('guide');
  let rounds = [], round = 0, hp = ROUNDS, fails = 0, onWin = null;

  const pad = new Pad({ pad: $('pad'), canvas: $('padCanvas'), video: $('cam'), status: $('camStatus'),
                        onSubmit: () => submit(), onClear: () => setFeedback('', '') });

  function setFeedback(text, cls) { feedback.textContent = text; feedback.className = 'feedback ' + cls; }
  function showHp() {
    $('bossHp').innerHTML = Array.from({ length: ROUNDS }, (_, i) => `<span class="${i < hp ? '' : 'lost'}">❤️</span>`).join('');
  }
  function showRound() {
    const [ch, emoji, word] = rounds[round];
    $('pEmoji').textContent = emoji;
    $('pWord').textContent = word;
    $('pText').innerHTML = `寫出「<mark>${word[0]}</mark>」的第一個注音`;
    guide.textContent = ch; guide.classList.remove('show');
    fails = 0;
    setFeedback(`第 ${round + 1} 題`, '');
    pad.clear();
    setTimeout(() => speak(word), 300);
  }

  function submit() {
    if (pad.busy) return;
    pad.endStroke();
    const target = rounds[round][0];
    const res = Recognizer.check(pad.strokes, pad.aspect, target);
    if (res.reason === 'empty') return setFeedback('先寫一個注音喔！', 'bad');
    if (res.reason === 'small') return setFeedback('寫大一點點喔！', 'bad');
    window.__duelLast = res.ranking.slice(0, 5);
    if (res.ok) {
      pad.busy = true;
      hp--; showHp();
      const bc = $('duelBoss'); bc.classList.remove('hit'); void bc.offsetWidth; bc.classList.add('hit');
      setFeedback(`答對了！「${target}」⚡ 魔法命中！`, 'ok');
      speak('答對了');
      setTimeout(() => {
        pad.busy = false;
        if (hp <= 0) finish(); else { round++; showRound(); }
      }, 1600);
    } else {
      fails++;
      setFeedback(fails >= 2 ? '看看提示，照著寫寫看！' : `看起來像「${res.best}」，再試一次！`, 'bad');
      if (fails >= 2) guide.classList.add('show');
      pad.clear();
    }
  }

  function finish() {
    pad.stop();
    screen.classList.add('hidden');
    onWin && onWin();
  }

  $('submitBtn').addEventListener('click', submit);
  $('clearBtn').addEventListener('click', () => { pad.clear(); setFeedback('', ''); });
  $('hintBtn').addEventListener('click', () => guide.classList.toggle('show'));
  $('speakBtn').addEventListener('click', () => speak(rounds[round][2]));

  return {
    open(bossImg, win) {
      onWin = win; pad.busy = false;
      const pool = [...WORDS].sort(() => Math.random() - 0.5);
      rounds = pool.slice(0, ROUNDS); round = 0; hp = ROUNDS;
      screen.classList.remove('hidden');
      const bc = $('duelBoss'), bg = bc.getContext('2d');
      bg.clearRect(0, 0, bc.width, bc.height);
      if (bossImg) bg.drawImage(bossImg, 0, 0, bc.width, bc.height);
      showHp(); showRound();
      pad.start({ camera: true });
    },
    preload() { window.AirWriter.preload().catch(() => {}); },
    // 測試用
    _test: { pad, submit, Recognizer },
  };
})();
</script>
